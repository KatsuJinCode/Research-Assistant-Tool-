[pytest]
# Pytest configuration for Research Verification Agent System

# Test discovery
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may use database/APIs)
    slow: Slow tests (>1 second)
    requires_api: Tests requiring API keys
    requires_db: Tests requiring database connection
    critical: Critical path tests (must always pass)

# Asyncio configuration
asyncio_mode = auto

# Timeout
timeout = 300
timeout_method = thread

# Coverage options
[coverage:run]
source = research_agent
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
